---
name: "Release"

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'z-shell/zunit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -yq zsh
      - name: Build zunit
        run: ./build.zsh
      - name: Run test suite
        run: ./zunit --tap tests
      - name: Verify release tag
        run: |
          tag="${GITHUB_REF_NAME}"
          scripts/verify-release-tag.zsh "$tag" ./zunit
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./zunit#zunit --clobber
          else
            gh release create "$tag" ./zunit#zunit --title "$tag" --generate-notes
          fi
