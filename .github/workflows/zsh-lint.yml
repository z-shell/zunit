---
name: Zsh Lint

on:
  push:
    branches: [main]
    paths:
      - "build.zsh"
      - "zsh-lint.json"
      - ".github/workflows/zsh-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "build.zsh"
      - "zsh-lint.json"
      - ".github/workflows/zsh-lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-lint:
    name: Zsh Lint / Zsh Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out zsh-lint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zsh-lint
          ref: 1e8b0a6c02d4aa433e6aee8ca141e11ef62ba76b
          path: .zsh-lint-tool
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.25"
      - name: Build zsh-lint
        run: go build -C .zsh-lint-tool -o "$RUNNER_TEMP/zsh-lint" ./cmd/zsh-lint
      - name: Run configured advisory profile
        run: '"$RUNNER_TEMP/zsh-lint" --config zsh-lint.json build.zsh'
