---
name: "✅ Zsh Check"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zsh-n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -yq zsh
      - name: Check Zsh syntax
        run: |
          find src -type f -name '*.zsh' -print | sort | while read -r file; do
            zsh -n "$file"
          done
          zsh -n build.zsh
          zsh -n zunit.zsh-completion
